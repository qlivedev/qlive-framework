# Present so pnpm stops looking upward: this makes qlive-doc its own workspace
# root rather than a package of the repository's. The docs toolchain is ~270
# packages that the Java and framework builds have no use for, so it installs
# only when someone builds the docs.
packages: []

# Astro's toolchain compiles native binaries. sharp is what backs the image
# service -- without it every <img> in a page fails to optimize at build time.
allowBuilds:
  esbuild: true
  sharp: true
