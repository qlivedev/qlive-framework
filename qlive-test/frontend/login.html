<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qlive-test - Login</title>
  </head>
  <body>
    <div id="root"></div>
    <script id="root-data" type="x-application/view-data"></script>
    <!--
      Root-absolute, unlike index.html's relative src: Vite's dev server rewrites a relative one only for
      the page it falls back to (index.html). This page is served under /login, where "./src/login.tsx"
      would resolve to /src/login.tsx and 404. A leading slash gets Vite's `base` prefixed in dev and is
      resolved from the project root in the build.
    -->
    <script type="module" src="/src/login.tsx"></script>
  </body>
</html>
