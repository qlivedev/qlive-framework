# Fixture for the query result type generation.
#
# The schema QLive's own GraphQLQueryTypingServiceTest builds its domain from, printed as SDL. The
# expectations on both sides are written against these types, which is what makes them comparable:
# the dev backend and this generator have to render the same query the same way.

schema {
    query: QueryType
    mutation: MutationType
}

"Generalized query configuration"
scalar QueryConfig

"SQL timestamp equivalent"
scalar Timestamp

"Auto-generated from TestLogic"
type QueryType {
    queryTestFooDocument(config: QueryConfig!): TestFooDocument!
    queryTestUserDocument(config: QueryConfig!): TestUserDocument!
}

"Auto-generated from TestLogic"
type MutationType {
    mDummy: Boolean
}

"Generated from public.test_foo"
type TestFoo {
    "DB column 'created'"
    created: Timestamp!
    "DB column 'description'"
    description: String
    "DB column 'flag'"
    flag: Boolean!
    "Target of 'type'"
    fooType: TestFooType!
    "DB column 'id'"
    id: String!
    "DB column 'name'"
    name: String!
    "DB column 'num'"
    num: Int!
    "Target of 'owner_id'"
    owner: TestUser!
    "DB foreign key column 'owner_id'"
    ownerId: String!
    "DB foreign key column 'type'"
    type: String!
}

"Generated for io.github.qlivedev.model.QueryDocument<TestFoo>"
type TestFooDocument {
    config: QueryConfig!
    rowCount: Int
    rows: [TestFoo]!
    type: String!
}

"Generated from public.test_foo_type"
type TestFooType {
    "DB column 'name'"
