# Log levels for tests. Tests run under the dev profile, and Spring ranks
# classpath:/config/ above classpath:/, so these override the levels in
# src/main/resources/application-dev.properties during tests only.

logging.level.org.springframework.security=INFO
logging.level.org.jooq.tools.LoggerListener=INFO
logging.level.io.github.qlivedev.qlive.runtime.pubsub.DefaultPubSubService=INFO
